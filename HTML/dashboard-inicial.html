<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dashboard-inicial-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="icon" href="/LOGO/icon2_logo.png">
    <title>Início - TaskFlow</title>
</head>
<body>
    <main>
        <div class="main-container">
            <aside class="sidebar">
                <img src="/LOGO/TaskFlow2_logo.png" alt="logo" width="180">
                <button class="btn-sidebar active"><span class="material-symbols-outlined">task_alt</span>Tarefas</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined">calendar_month</span>Calendário</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined">folder</span>Projetos</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined">settings</span>Configurações</button>

                <div class="footer-sidebar">
                    <div class="line-div"></div>
                    <footer>
                        <p>Copyright 2026</p>
                    </footer>
                </div>
                
            </aside>
            <div class="main-content">
                <div class="header-main">
                    <p>Olá, Usuário</p>
                    <span class="material-symbols-outlined" style="font-size: 30px; margin-right: 15px;">account_circle</span>
                </div>
                <div class="task-content">
                    <div class="container-add-task">
                        <span class="material-symbols-outlined">assignment_add</span>
                        <input type="text" placeholder="Nomear nova tarefa...">
                        <button class="btn-add-task"><span class="material-symbols-outlined">add_2</span>Adicionar Tarefa</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
