<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dashboard-inicial-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="icon" href="/LOGO/icon2_logo.png">
    <title>Início - TaskFlow</title>
</head>
<body>
    <main>
        <div class="main-container">
            <aside class="sidebar">
                <img src="/LOGO/TaskFlow2_logo.png" alt="logo" width="180">
                <button class="btn-sidebar active"><span class="material-symbols-outlined" style="font-size: 30px;">task_alt</span>Tarefas</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined" style="font-size: 30px;">calendar_month</span>Calendário</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined" style="font-size: 30px;">folder</span>Projetos</button>
                <button class="btn-sidebar"><span class="material-symbols-outlined" style="font-size: 30px;">settings</span>Configurações</button>

                <div class="footer-sidebar">
                    <div class="line-div"></div>
                    <footer>
                        <p>Copyright 2026</p>
                    </footer>
                </div>
                
            </aside>
            <div class="main-content">
                <div class="header-main">
                    <p>Olá, Usuário</p>
                    <span class="material-symbols-outlined" style="font-size: 30px; margin-right: 15px;">account_circle</span>
                </div>
                <div class="task-content">
                    <div class="container-add-task">
                        <span class="material-symbols-outlined" style="font-size: 30px;">assignment_add</span>
                        <input id="task-input" type="text" placeholder="Nomear nova tarefa...">
                        <button class="btn-add-task" id="btnaddtask"><span class="material-symbols-outlined">add_2</span>Adicionar Tarefa</button>
                    </div>
                    <div class="container-tasks">
                        <div id="task-pending" class="container">
                            <div class="header-task">TAREFAS PENDENTES</div>
                        </div>
                        <div class="container">
                            <div class="header-task">CONCLUÍDAS</div>
                            <div class="tasklist">
                                <div class="checklist">
                                    <input type="checkbox">
                                </div>
                                <div class="info-task">
                                    <div class="task-body">
                                        <p class="title-task">Título da tarefa concluída</p>
                                        <p class="desc-task">Descrição da tarefa concluída</p>
                                        <p class="label-task">Etiquetas da tarefa concluída</p>
                                    </div>
                                    <div class="dropdown">
                                        <button class="btn-actions-menu"><span class="material-symbols-outlined">more_horiz</span></button>
                                        <div class="dropdown-menu">
                                            <button class="btn-dropdown-menu"><span class="material-symbols-outlined">delete</span>Excluir</button>
                                        </div>
                                    </div>

                                </div>
                                 
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="toast" class="toast-hidden">Tarefa adicionada com sucesso!</div>
        </div>
    </main>
    <script src="/JS/dashboard-inicial.js"></script>
</body>
</html>
