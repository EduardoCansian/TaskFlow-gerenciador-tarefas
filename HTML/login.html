<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>
    <link rel="icon" href="\LOGO\icon2_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="\CSS\login-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <main>
        <div class="login-container">
            <section>
                <form action="#" method="post" class="form-login">
                    <div class="header-login">
                        <img src="\LOGO\TaskFlow2_logo.png" alt="logo" width="230"> 
                        <h1>Bem-vindo de volta</h1>
                    </div>
                    <label for="email">E-mail</label>
                    <div class="input-group">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                    <label for="password">Senha</label>
                    <div class="input-group">
                        <i class="bi bi-lock"></i></label>
                        <input type="password" id="password" placeholder="****" required>
                    </div>
                    <a href="" id="forgot-password">Esqueceu a senha?</a>
                    <button type="submit">Entrar <i class="bi bi-arrow-right"></i></button>
                    <div class="line-div">-</div>
                    <div class="footer-text">
                        <p>Não tem uma conta?</p>
                        <a href="">Cadastre-se aqui</a>
                    </div>
                    </form>
            </section>
        </div>
    </main>
    <script src="login.html"></script>
</body>
</html>
